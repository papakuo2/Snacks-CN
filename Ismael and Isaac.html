	<ul><h3>12. 以實瑪利與以撒 (創世紀 17: 17 - 20)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我們常常把阿拉伯國家與以色列之間的衝突追溯到他們的祖先以實瑪利與以撒，因為最初就是這樣開始的。事實上，以實瑪利與以撒更像我們——那些蒙恩得救的外邦人，以及本族的以色列人——兩者都從上帝領受了同樣的祝福與應許。然而，我們這些外邦人，如同上帝所描述像以實瑪利的野驢。這是什麼意思？我們該怎麼做？</h4></ul>
