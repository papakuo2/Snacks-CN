	<ul><h3>27. 以撒、雅各與約瑟 - 基業（希伯來書 11: 17 - 22）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>約瑟為以色列做出了很大的貢獻。然而，在聖經中，上帝只稱自己為亞伯拉罕、以撒和雅各的上帝。我們知道亞伯拉罕一生都遵行上帝的命令，並且與上帝非常親近。雅各也是如此。然而，他卻很狡猾，甚至欺騙了自己的兄弟和父親。聖經中也沒有提到以撒與上帝之間有很多親密的互動。因此，為什麼上帝仍然稱自己為以撒和雅各的上帝呢？</h4></ul>
