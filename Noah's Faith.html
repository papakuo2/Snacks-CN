	<ul><h3>5. 挪亞的信心 (創世紀 7: 11 - 13)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我們常常在新聞中讀到關於失落的挪亞方舟的消息，或者甚至有人試圖複製挪亞方舟。毫無疑問，人們對挪亞方舟的偉大工程感到驚嘆。然而，真正的問題是，究竟是什麼驅使一個人完成這樣的任務？我們能從中學到什麼？我們可以將其應用在自己身上嗎？</h4></ul>
