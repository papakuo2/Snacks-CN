	<ul><h3>5. 建造者（希伯來書 3: 1 - 6）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝渴望與祂所造的人同住。因此，祂建造了伊甸園。祂也吩咐摩西建造會幕,要與以色列人同住。儘管後來人們也試圖建造聖殿讓上帝居住，但都已成為過去。然而，上帝從未停止要與人同住的心意。後來耶穌基督來成就這個心意。這也使我們參與建造上帝的居所。那麼，我們知道如何成為這個過程的一部分嗎？</h4></ul>
