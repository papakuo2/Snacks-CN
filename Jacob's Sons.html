	<ul><h3>32. 雅各的兒子們（創世記 35: 23 - 26）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我曾聽過一個故事：有一位牧師邀請一個人去教會，那個人拒絕說，他不會去，因為教會裡滿是偽君子。牧師回答說，他說得沒錯。不過，總是還有一個人的位置。即使我們已經得救，我們仍然不比未得救的人更好，有時甚至更糟。這就像雅各的十二個兒子一樣。他們彼此之間都有各自的問題。然而，上帝卻定意要從他們建立以色列民族。因此，我們怎麼能期待上帝從我們當中建立祂的教會，甚至更多呢？我們該如何預備自己？</h4></ul>
