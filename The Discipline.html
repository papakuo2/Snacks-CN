	<ul><h3>32. 管教（希伯來書 12: 3 - 10）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在得救之後，上帝也希望我們被成聖並得以完全，使我們可以成為祂聖潔榮耀、合法的兒子。為此，上帝按著祂的旨意管教我們，這會帶來成長的痛苦。有沒有方法可以減輕這種成長的痛苦？另外，我們要如何明白上帝的管教並順服呢？</h4></ul>
