	<ul><h3>17. 撒拉之死（創世記 23: 1 - 4）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在美國擁有一塊土地或房子似乎是理所當然的事。許多人稱之為美國夢。上帝也曾應許亞伯拉罕迦南地。然而當撒拉去世時，亞伯拉罕卻沒有擁有他想用來埋葬撒拉的土地。相反地，亞伯拉罕必須為那塊土地支付一筆可觀的代價。那麼，為什麼上帝的應許需要這麼長的時間才實現？另外，那塊讓亞伯拉罕付出巨額代價購買的土地究竟有什麼特別之處？我們可以從亞伯拉罕的行為中學到什麼？</h4></ul>
