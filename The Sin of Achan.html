	<ul><h3>8. 亞干的罪 （約書亞記 7: 1）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>人不斷犯罪。有時候，上帝會對罪作出嚴厲甚至致命的回應，例如亞干所犯的罪，他從耶利哥拿了一些戰利品並藏起來。因為亞干所做的事，上帝不僅讓以色列人在艾城被擊敗，還讓 36 人死亡。在被發現後，約書亞命令以色列人用石頭砸死亞干、他的兒女和所有牲畜，並燒毀戰利品和他們的財物。然而，有時候，上帝會寬恕在不同情況下犯下的罪，或寬恕不同的人，例如大衛。那麼，背後的原因是什麼？我們如何才能避免犯下致命的罪？</h4></ul>
