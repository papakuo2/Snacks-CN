	<ul><h3>18. 成聖 (希伯來書 10: 3 - 10)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我們知道，要赦免罪，就必須付出代價。正因如此，以色列人獻上祭物來贖罪。後來耶穌基督來到世上，為我們獻上自己，一次獻上就永遠成就了救贖，使我們得以完全被聖別。由於聖殿已不復存在，這個救恩更顯真實。然而為什麼我們仍然感到空虛？為什麼我們仍然會被世界誘惑去犯罪？我們要如何才能得到被聖別的確據呢？</h4></ul>
