	<ul><h3>16. 猶大的分地 (約書亞記 15: 1 - 6)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>猶大支派的人按著宗族所得的地業，在儘南邊，到以東的交界，向南直到尋的曠野。神也應許迦勒在迦南南方的土地為他的產業。這件事發生在以色列人仍在西奈曠野漂泊的時候。兩份產業都是同一塊土地，這是否是巧合？或者，這是因為迦勒的緣故嗎？我們可以從中學到什麼？</h4></ul>
