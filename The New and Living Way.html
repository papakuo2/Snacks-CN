	<ul><h3>20. 又新又活的道路（希伯來書 10: 19 - 25）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>基督為我們的罪而死，使我們從一切罪中得釋放。所以，我們應當覺得自己是被分別為聖並被成全的。然而，我們的良心卻會告訴我們相反的事。良心告訴我們什麼是對與錯，而這是建立在我們舊的肉體之上，也就是那關於善惡的詭詐知識。這本身就是罪。因此，即使我們已經得救，我們仍然被罪所捆綁，以致感覺自己是有罪的。那麼，我們應該怎麼做，才能脫離舊的肉體，活出一條新而活的道路呢？</h4></ul>
