	<ul><h3>5. 割禮 （約書亞記 5: 5 - 9）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>約旦河以西的所有國王，以及沿海的所有迦南國王，在聽到以色列人如何渡過約旦河後，他們的心都融化了。然而，神命令約書亞做的第一件事，就是為以色列人行割禮，以滾去埃及的羞辱。為什麼會這樣？埃及的羞辱是什麼？割禮真的有效嗎？對於那些因恩典而得救的人來說，這意味著什麼？我們需要受割禮嗎？</h4></ul>
