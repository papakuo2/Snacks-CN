	<ul><h3>13. 永遠的祭司（希伯來書 7: 11 - 17）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝賜給以色列人律法，使他們知道如何敬拜與服事上帝。然而，對上帝的敬拜早在那之前就已開始，甚至可以追溯到該隱與亞伯。同樣地，大祭司的起源也可以追溯到麥基洗德。然而，基督是從永遠到永遠的。所以，我們是否知道在生命中如何接受基督作為永遠的大祭司呢？</h4></ul>
