	<ul><h3>21. 雅各的夢（創世記 28:12-19）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>如《聖經》所描述，上帝過去常透過夢境傳遞祂的信息。我們從那些清楚地接收到夢境的人身上學習到上帝的信息。這也使那些人，如雅各等，成為傳奇人物。當然，也有許多虛假的夢境，事後被證明是錯誤的。除了夢境之外，我們也聽說有人說方言，並聲稱是來自上帝。那麼，我們該如何判斷呢？或者，我們能領受什麼是上帝真正的話語呢？</h4></ul>
