	<ul><h3>3. 渡過約旦河 （約書亞記 3: 2 - 8）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>人們熟悉摩西如何分紅海，但卻不常提到約書亞如何截斷約旦河。也許是因為後者的規模小得多？事實上，上帝對以色列人渡過約旦河一事相當認真。他們需要自潔。然後遵循指引來渡河。為什麼需要這樣？這對當今的基督徒有何影響？</h4></ul>
