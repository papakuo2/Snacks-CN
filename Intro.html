	<ul><h4>歡迎來到「聖經小品」的天地。正如名稱所示，每篇文章都只是對某個聖經主題的簡短品嚐，絕非提供該主題的完整盛宴。其目的是引發你對更多閱讀聖經的渴望。我過去常把這些心靈小品的文章透過電子郵件寄給家人，其中有些家人很喜歡這些想法。所以，希望你們當中也有人會有同樣的感受。目前這些小品涵蓋《舊約》的〈創世記〉與〈出埃及記〉，以及《新約》的〈希伯來書〉。盼望在上帝允許下，之後很快會再新增更多。以馬內利。祝您好胃口。</h4></ul>
