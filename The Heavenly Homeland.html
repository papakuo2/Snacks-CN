	<ul><h3>26. 天上的家鄉（希伯來書 11: 13 - 16）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>信心會把我們的視野提升到天上。亞伯拉罕一生都住在帳棚裡。因此，他的信心使他知道，上帝所應許的國度不是建造在地上，而是在天上。在全能的上帝使撒拉懷孕並生下以撒之後，撒拉明白上帝所應許的後裔不是憑著肉體而生，而是來自天上的神聖能力。所以，他們知道上帝所應許的家鄉超越這個世界。我們如何找到我們天上的家，並到達那裡呢？F</h4></ul>
