	<ul><h3>22. 西奈山（出埃及記 19: 1 - 6）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>西奈山也被稱為何烈山。上帝曾在何烈山的燃燒荊棘中向摩西顯現。如今，上帝又在西奈山向以色列人顯現，要使以色列人成為祂珍貴的產業。這兩件事都發生在很久以前。那麼，它們與我們這些因救主耶穌基督而得救的信徒有什麼關係呢？為什麼我們需要學習西奈山呢？</h4></ul>
