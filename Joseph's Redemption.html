	<ul><h3>43. 約瑟的救贖 (Genesus 42: 18 - 25)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>原諒是困難的。遺忘更是困難。這對加害者與受害者雙方都是真實的。雖然約瑟因為兄弟對他所做的事而受了很多苦，但他的兄弟們也因為無法忘記自己對約瑟所做的事而承受痛苦。那麼，當約瑟終於有機會時，他是如何救贖自己的呢？作為蒙拯救的信徒，我們又該如何從這種情況中救贖自己呢？</h4></ul>
