	<ul><h3>51. 以色列祝福其他兒子（創世記 49: 13 - 27）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>挪亞對他三個兒子的預言，決定了人類的歷史。雅各對他十二個兒子的預言，不僅決定了人類的未來，也決定了神國的未來。難怪天使宣稱雅各曾與上帝及人摔跤，並且得勝。同樣感動雅各的聖靈，也能感動那些蒙恩得救的人。那麼，我們知道如何使它成為現實、來決定我們的屬靈成長呢？</h4></ul>
