	<ul><h3>29. 立約（出埃及記 24: 3 - 7）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在宣告誡命與律法之後，摩西作為上帝的中保立了一個約。他獻上一頭公牛，將一半的血盛在盆中，另一半的血灑在祭壇上。他也把血灑在百姓身上，並命令他們遵守這約。雖然百姓承諾會順服，但他們的順服並沒有持續太久。因此，上帝立了第二個約。第二個約是什麼？第一個約與第二個約有什麼不同？我們如何知道第二個約會比第一個約更適合我們？</h4></ul>
