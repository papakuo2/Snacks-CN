	<ul><h3>27. 瑪哈念（創世記 32: 1 - 8）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝愛雅各。當上帝應許要與雅各同在、帶領他回迦南時，祂派來的不是一隊，而是兩隊天使來迎接雅各。雅各確實明白了這個信息，因此他將那個地方命名為「瑪哈念」，意思是「上帝的兩軍隊」。那個地方後來成為以色列人心中的聖地，用來象徵上帝的恩典與保護。雅各也因此受到天使的啟發，在與以掃見面之前，將自己的家人分成兩組。那麼，我們可以從像雅各所遇見的天使身上學到什麼，並應用在我們自己的生活中呢？</h4></ul>
