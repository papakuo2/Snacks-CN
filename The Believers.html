	<ul><h3>6. 相信（希伯來書 3: 12 - 19）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝可以與人立下許多的約，將祂的祝福賜給人；然而，如果人不相信上帝，那麼一切都是徒然的。因為自從人類犯罪以來，我們就處在善惡知識的領域之下，並擁有自己的信念。唯一能改變這一切的方法是透過聖靈。我們如何知道聖靈能將我們從以自我為中心的罪人轉變為被潔淨的信徒呢？</h4></ul>
