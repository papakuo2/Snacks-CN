	<ul><h3>8. 另有一個日子（希伯來書 4: 6 - 10）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>約書亞曾應許一些以色列人，要幫助他們的弟兄進入迦南地，然後上帝會使他們與弟兄們都得享安息。然而，根據聖經記載，由於以色列人的不順服，約書亞所帶來的安息日並沒有持續太久。在聖經中，有預表與實體。那麼，約書亞的安息日是否是一種預表？如果是的話，那真正安息日的實體是什麼？是另有一個日子嗎?</h4></ul>
