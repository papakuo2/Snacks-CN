	<ul><h3>12. 征服北方諸王 (約書亞記 11: 1 - 5)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在看到亞摩利人和迦南南方的諸王在反抗以色列人時所發生的事情後，迦南北方的諸王仍然想要反抗以色列人。他們有馬匹和戰車，這不是一支普通的軍隊。然而，上帝將他們交在以色列人手中。以色列人不僅殺了他們，還砍斷了他們的馬蹄筋，並用火燒毀了他們的戰車。基遍人也是強大的戰士。為什麼他們能夠臣服於以色列人，而其他迦南人卻不能？我們可以從他們身上學到什麼？</h4></ul>
