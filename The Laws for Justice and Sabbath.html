	<ul><h3>27. 公義與安息日的律法（出埃及記 23: 1 - 9）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝是公義且正直的。因此，上帝命令以色列人藉著遵守祂的律法來行公義。上帝也命令以色列人守安息日，好領受祂的祝福。那麼，對於我們這些因救主耶穌基督而得救的人來說，我們是否也應該像以色列人一樣遵守律法呢？或者，我們是否也需要像以色列人一樣守安息日，才能得著上帝所應許那些守安息日之人的祝福呢？我們該如何理解這些律法，並將它們應用在我們的生活中呢？</h4></ul>
