<!-- HTML Audio Element -->
<a href="Joshua.html">[約書亞記首頁]</a>
<ul><h3>約書亞記小品總集</h3></ul>

<audio id="audioPlayer" controls></audio>

<ul><h3>
<input type="number" id="trackInput" placeholder="請輸入小品前言／內容編號"">
<button onclick="goToTrack()">播放小品前言／內容</button>
</h3></ul>

<script>
const titles = [
  "The Mission Audio",
  "Rahab of Jericho Audio",
  "Crossing the Jordan Audio",
  "Twelve Memorial Stones Audio",
  "The Circumcision Audio",
  "The Lords Army Audio",
  "The Fall of Jericho Audio",
  "The Sin of Achan Audio",
  "The Fall of Ai Audio"
];

const playlist = [];
titles.forEach(title => {
  playlist.push(`${title} short.mp3`);
  playlist.push(`${title}.mp3`);
});

let currentTrackIndex = 0;
const player = document.getElementById("audioPlayer");

// Load first track
player.src = playlist[currentTrackIndex];

// Manual track selection
function goToTrack() {
  const input = document.getElementById("trackInput").value;
  const index = Number(input) - 1;

  if (index >= 0 && index < playlist.length) {
    currentTrackIndex = index;
    player.src = playlist[currentTrackIndex];
    player.play();
  } else {
    alert("小品前言／內容編號超出範圍。請輸入一個不大於 18 的數字");
  }
}

// Auto-play next track when finished
player.addEventListener("ended", () => {
  currentTrackIndex++;

  if (currentTrackIndex < playlist.length) {
    setTimeout(() => {
      player.src = playlist[currentTrackIndex];
      player.play().catch(err => console.log("Playback interaction required:", err));
    }, 1000);
  } else {
    alert("小品前言／內容播放已完成。");
  }
});
</script>
