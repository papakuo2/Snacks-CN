	<ul><h3>45. 猶大的奉獻擺上（創世記 44: 27 - 34）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>猶大在他的兄弟之中似乎既不具野心，也不特別出眾。甚至他的兩個長子也因邪惡的行為被上帝擊殺而死。然而，後來雅各預言基督將出自猶大的後裔。事實上，這確實應驗了。那麼，是什麼使猶大如此特別呢？我們可以從他身上學到什麼？</h4></ul>
