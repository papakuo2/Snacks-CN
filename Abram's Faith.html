	<ul><h3>8. 亞伯蘭的信心 (創世紀 12: 1 - 4)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>像拜偶像一樣敬拜上帝真的那麼錯嗎？為什麼上帝如此嚴格地禁止這樣做？看起來敬拜一個看得見的偶像，比起敬拜一位看不見的上帝要容易得多。根據聖經，亞伯蘭是從一個充滿拜偶像的地方被呼召出來的。那麼，他是如何辨認出這位看不見的上帝的呼召呢？另外，上帝也會呼召我們離開嗎？如果會，我們又該如何分辨呢？</h4></ul>
