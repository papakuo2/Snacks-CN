	<ul><h3>26. 鄰舍的律法（出埃及記 22: 21 - 27）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>自從上帝宣告了「不可貪戀你鄰舍的房屋、妻子等等」這條誡命以來，人們一直想知道，為什麼這條誡命只強調於鄰舍？為什麼鄰舍的財物如此特別？誰才是人的鄰舍？如果我們能理解這條誡命的目的，那麼我們就能理解並達成上帝為我們所預備的一切。那麼，我們該如何理解上帝對這條誡命的心意呢？</h4></ul>
