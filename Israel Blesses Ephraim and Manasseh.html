	<ul><h3>49. 以色列為以法蓮和瑪拿西祝福 (創世記 48: 14 - 20)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>一個人的名字代表這個人。因此人們在為孩子命名時都很慎重。然而，一個人的名字能決定他的命運嗎？約瑟有兩個兒子。他為他們命名，以代表他人生的兩個階段：困苦與豐盛。然而，當雅各為他們祝福時，他祝福了較年幼的兒子，先是豐盛，後是較年長的兒子，困苦。得救之後，我們知道自己的新身份是什麼嗎？我們該如何活出這個新的名字？</h4></ul>
