	<ul><h3>10. 青蛙、蚊蚋與蒼蠅之災（出埃及記 8: 1 - 4）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>當我們談到瘟疫時，我們會想到像黑死病、流感病毒瘟疫、大腸桿菌瘟疫、霍亂瘟疫等等，這類容易讓人感到恐懼的疾病。然而，當上帝降下災禍給埃及人時，卻是青蛙、蚊蚋、蒼蠅等等，這類只能讓人感到不適或厭惡的東西。沒有人因此死亡。為什麼會這樣？這又如何能讓法老產生足夠的恐懼而讓以色列人離開呢？我們能從上帝的用意中學到什麼？</h4></ul>
