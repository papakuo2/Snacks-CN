<ul><h3>33. 至聖所（出埃及記 26: 31 - 37）</h3></ul>
<ul><h3>前言</h3></ul>
<ul><h4>上帝是聖潔的。因此，以色列人為上帝的居所建造的會幕也是聖潔的。然而，什麼是聖潔呢？如果我們沒有聖潔的概念，我們就不會明白上帝願意住在祂百姓中間的重要性。更不用說會幕中的聖所和至聖所能為我們帶來什麼了吧？尤其是，會幕連同聖所和至聖所都已經不在了。這是否意味著約櫃和施恩座對以色列人和世人來說都成了過去的事呢？</h4></ul>
