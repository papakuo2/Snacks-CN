<ul><h3>31. 陳設家具（出埃及記 25:10 - 16）</h3></ul>
<ul><h3>前言</h3></ul>
<ul><h4>上帝吩咐以色列百姓建造會幕，好讓祂能住在他們中間。在會幕裡，他們需要按照特定的設計製作一個帶有金製施恩座的約櫃、陳設餅桌以及金燈臺。然而，約櫃會被帷幕遮掩，只有大祭司才能接近。因此，其他人並不容易直接接觸到上帝的憐憫。現在，那一切都已經消失了。我們還有辦法接近上帝的施恩座嗎？如果有，那該如何做呢？</h4></ul>
