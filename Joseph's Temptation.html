	<ul><h3>38. 約瑟的受試探（創世記 39: 2 - 9）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>很難想像像耶穌那樣毫無罪惡。事實上，耶穌是以罪人的形象出生，但從未犯罪。如果我們回顧約瑟的一生，就可以看到一幅與耶穌基督相似的縮影。約瑟和耶穌一樣，都被置於困難甚至充滿敵意的環境中。他像耶穌一樣面對無數的試煉與試探。他展現出令人驚嘆、唯有出自上帝的智慧，就像耶穌一樣。他像耶穌一樣為人們帶來拯救。最重要的是，他沒有犯致命的罪，就像耶穌一樣。他的秘密是什麼？在基督作為我們救主的情況下，我們能比他更好嗎？</h4></ul>
