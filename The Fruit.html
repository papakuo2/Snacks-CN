	<ul><h3>33. 義果（希伯來書 12: 11 - 17）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>亞當和夏娃吃了分別善惡樹上的果子。因此，我們有罪的肉體只能結出詭詐邪惡的果子。上帝的管教會訓練我們脫離舊有的肉體，結出平安的義果。這是一個由內到外、充滿痛苦的全人生命轉變。那麼，我們該如何在生活中接納它，並知道該結出什麼樣的果子呢？</h4></ul>
