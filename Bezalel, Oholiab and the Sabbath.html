<ul><h3>40. 比撒列、亞何利亞伯與安息日（出埃及記 31: 2 - 11）</h3></ul>
<ul><h3>前言</h3></ul>
<ul><h4>上帝用塵土造了亞當，將祂的靈吹入他的體內，使他活過來，並將他安置在伊甸園中耕種看守。如今，上帝將祂的靈賜給比撒列和亞何利亞伯，使他們能按照上帝的吩咐，製造會幕所需的一切器具。上帝也吩咐以色列人守安息日。除了事奉上帝、遵守祂的誡命之外，上帝還有其他的旨意和目的嗎？特別是對我們這些因恩典而得救的人來說？</h4></ul>
