	<ul><h3>9. 亞伯蘭地上的後裔 (創世紀 13: 14 - 17)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝對亞伯拉罕作了幾個應許。為什麼會這樣？為什麼上帝不把所有的應許合成一個大的應許呢？難道上帝一開始不知道祂對亞伯拉罕的計畫嗎？如果我們研究上帝在什麼情況下對亞伯拉罕作出每一個應許，那麼我們就會知道上帝對信心之旅的計畫。我們了解得越多，就越知道上帝的旨意，以及如何將其應用在我們的屬靈成長上。</h4></ul>
