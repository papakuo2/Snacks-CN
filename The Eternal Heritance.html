	<ul><h3>16. 永恆的基業（希伯來書 9: 15 - 22）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝愛世人，甚至將他的獨生子賜給他們，叫一切信他的，不致滅亡，反得永生。這是上帝所應許的，並且如同遺命一般，在耶穌基督為我們的罪而死之後得以成就。的確，藉著接受基督為救主，我們承受了這份遺命，就是永生。永生的目的，是與上帝同住。那麼，我們現在是否對這永恆的產業有確據呢？</h4></ul>
