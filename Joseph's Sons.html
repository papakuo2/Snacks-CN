	<ul><h3>41. 約瑟的兒子們（創世記 41: 50 - 53）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>約瑟有兩個兒子。他為長子取名是為了忘記苦難，為次子取名是為了記念豐盛。這兩個名字都是為了記念上帝為他所做的一切。當耶穌告訴我們要背起自己的十字架來跟隨他時，我們知道他希望我們承受與他相同的苦難。那麼，我們要如何確保自己能夠承受這些苦難，並像約瑟後來一樣得勝呢？</h4></ul>
