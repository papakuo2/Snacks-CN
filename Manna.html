	<ul><h3>19. 嗎哪（出埃及記 16: 2 - 3）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>嗎哪，是在出埃及的 40 年期間，從天上降下來餵養以色列百姓的食物。為什麼我們現在看不到嗎哪了？如果上帝能夠在 40 年間從天上降下嗎哪，那麼對上帝來說，這應該不是一件困難的事。所以，為什麼上帝停止從天上降下嗎哪？或者，上帝其實仍然在這麼做？如果是這樣，那我們要如何知道，又該如何找到它？</h4></ul>
