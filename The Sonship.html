	<ul><h3>15. 兒子的名分 (創世紀 21: 8 - 13)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝賜福以實瑪利，因為他是亞伯拉罕的後裔。然而，他並不擁有亞伯拉罕的產業繼承權。我們因接受基督作為救主而得救。然而，如同以實瑪利一樣，我們或許蒙福，但仍無法承受整個產業，因為我們仍活在舊的自我之中，而那舊我仍是肉體的奴僕。要承受產業，我們需要擁有兒子的名分；要擁有兒子的名分，我們必須重生。所以，我們該如何重生以得著兒子的名分呢？</h4></ul>
