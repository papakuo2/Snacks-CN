	<ul><h3>3. 人（希伯來書 2: 6 - 11）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>亞當與夏娃違背了上帝的命令，吃了分別善惡樹的果子，想要像上帝一樣。聖經告訴我們，上帝使人暫時比天使微小；以榮耀和尊貴為冠冕加在人身上，並將萬物都服在他的腳下。這與上帝對亞當與夏娃所做的安排非常接近。然而，他們失敗了。那麼，我們怎麼知道這對我們也能成為現實，而且我們不會失敗呢？</h4></ul>
