	<ul><h3>12. 誓言（希伯來書 6: 13 - 20）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝應許亞伯拉罕，使他成為一個大國，擁有無數後裔與廣大的土地，不僅藉著約，也以誓約來加以確立。事實上，這正是所發生的事。在得救之後，我們如今因信成為亞伯拉罕的後裔。那麼，這個誓約是否仍然適用於我們？如果是這樣，那麼我們是否知道上帝希望我們成為什麼樣的人，以及該如何成為呢？</h4></ul>
