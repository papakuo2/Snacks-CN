	<ul><h3>23. 雅各的妻子們（創世記 29:16 - 24）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在過去，人們偏好大家庭，人越多越熱鬧。有些家庭甚至以同一屋簷下住著四代或五代人為榮。也許這就是為什麼上帝給了雅各四個妻子。那些妻子為雅各生了十二個兒子，從他們之中誕生了一個民族。然而，雅各並沒有平等對待他的妻子。特別是，比起利亞他更偏愛拉結。因此，上帝讓利亞先懷孕，並賜給利亞比雅各其他的妻子（包括拉結）更多的兒子。這顯示上帝在祂的計畫中對所有相關的人都是公義且憐憫的。那麼，我們該如何學習順服在上帝的計畫之中呢？</h4></ul>
