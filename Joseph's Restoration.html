	<ul><h3>44. 約瑟的復興 (創世記 43: 31 - 34)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>約瑟的成功並非偶然。與我們大多數人不同，他不僅能看見問題，也能提出解決方案，就像他為法老解夢時所做的一樣。他對自己的家人也是如此。即使他哥哥們所做的是錯的，他仍試圖按照上帝在他夢中所顯示的來使這個家庭得以復興。作為蒙拯救的人，上帝也藉著聖靈在基督裡試圖恢復我們。因此，我們知道要如何跟隨聖靈呢？</h4></ul>
