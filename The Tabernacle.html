	<ul><h3>32. 帳幕 (出埃及記 26: 1 - 6)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>為了住在以色列人中間，上帝吩咐他們建造約櫃，即施恩座，以及其他各種傢具，並且詳盡規定其製作方式。上帝也吩咐以色列人按極其詳細的規格製作會幕的幔子和框架。然後，他們應該按照山上所示的計劃建立會幕。上帝是有秩序的上帝。聖經也教導我們要遵循秩序，如下所述。<ul><h4>
凡事都要規規矩矩地按著次序行。(哥林多前書 14:40)
</h4></ul>
那麼，我們如何理解上帝對會幕計劃的意義呢？</h4></ul>
