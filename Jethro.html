	<ul><h3>21. 葉忒羅（出埃及記 18: 5 - 9）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>葉忒羅，這個名字我們可能不太會特別注意。我們只知道他是米甸的祭司，也是摩西的岳父。然而，當我們越了解他，就越知道他或許以很大的方式影響了以色列人，即使他並不是以色列人。那麼，我們可以如何認識他，來拓展我們屬靈的容量呢？</h4></ul>
