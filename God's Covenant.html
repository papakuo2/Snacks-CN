	<ul><h3>11. 上帝的約 (創世紀 17: 3 - 7)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我們經常聽到，如今的年輕人不太願意結婚，更不用說生孩子了。特別是在那些過去重視婚姻與生育的亞洲國家。這是因為年輕人不再想承擔沉重的負擔。此外，他們認為這個世界過於敗壞且充滿敵意，不適合將孩子帶到這個世界。然而, 上帝應許亞伯拉罕有無數的後裔。不僅如此，上帝還與亞伯拉罕立約。換句話說，上帝會幫助亞伯拉罕實現這個應許。那麼，這個約如何幫助亞伯拉罕的信心呢？我們又如何從中學習，以克服對生育孩子的恐懼呢？</h4></ul>
