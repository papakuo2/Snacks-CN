	<ul><h3>10. 順服（希伯來書 5: 1 - 10）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我們常常將順服與壓抑連結在一起，因為順服似乎與自由相反。因此，有一些著名的句子，例如「不自由，毋寧死」，或「生命誠可貴，愛情價更高。若為自由故，兩者皆可拋」等等。由於在肉體中，我們喜歡自由，那麼我們又怎麼能順服上帝呢？</h4></ul>
