	<ul><h3>1. 男嬰（出埃及記 1: 18 - 22）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>聖經描述上帝對以色列的愛：「以色列年幼的時候，我就愛他，從埃及召出我的兒子。」然而，「他們越被呼召，就越遠離我；他們仍然向巴力獻祭，並向偶像燒香獻祭。」儘管如此，出埃及的旅程是以色列人最接近上帝的一次經歷。因此，我們越熟悉《出埃及記》，我們的眼睛與心思就應當越被開啟，去認識這位奇妙偉大的上帝。然而，我們該如何預備自己，避免像以色列人之後那樣遠離上帝呢？</h4></ul>
