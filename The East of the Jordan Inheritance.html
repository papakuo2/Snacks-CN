	<ul><h3>14. 約旦河以東的產業 (約書亞記 13: 1 - 7)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>經過一段時間的戰鬥後，仍有許多土地有待佔領。神沒有叫約書亞繼續征戰，而是吩咐他將這片土地分給他們作為產業。這是因為以色列人像約書亞一樣都老了嗎？還是他們缺乏信心？神為什麼會允許這種情況發生？我們可以從中學到什麼，並應用到我們的生活中？</h4></ul>
