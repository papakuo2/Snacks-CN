<ul><h3>42. 摩西的代求（出埃及記 33: 11 - 17）</h3></ul>
<ul><h3>前言</h3></ul>
<ul><h4>金牛犢事件之後，上帝決定離開以色列人，將他們託付給一位天使帶領。然而，摩西為以色列人求情。於是，上帝改變了主意，不再拋棄以色列人。摩西是如何做到的？難道上帝真的如此輕易地改變主意，即便拜偶像嚴重違背了祂的誡命？或者，其中另有隱情？我們能從這件事學到什麼？</h4></ul>
