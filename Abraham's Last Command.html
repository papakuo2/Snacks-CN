	<ul><h3>18. 亞伯拉罕的最後命令（創世記 24:1-4）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我們都希望能活得更久。如果不能，那至少我們希望能把自己的心願傳承下去，盼望有一天能夠實現。亞伯拉罕也不例外。他將自己的最後心願化為命令，交給他的僕人去遵行。為什麼他如此真誠？難道上帝不是已經應許他所有那些祝福了嗎？他還能做些什麼來更加確保那些祝福實現？我們能從亞伯拉罕身上學到關於生命真正意義的什麼呢？</h4></ul>
