	<ul><h3>11. 征服亞摩利人和南方諸王 (約書亞記 10: 1 - 5)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>儘管上帝命令以色列人攻打迦南人，但以色列人仍饒了喇合和基遍人。然而，亞摩利人的諸王並沒有像基遍人那樣與以色列人立約，反而集結軍隊，向基遍發動戰爭。正如基遍人所懇求的，約書亞率領以色列人與亞摩利諸王作戰。在上帝的幫助下，亞摩利人的所有軍隊和諸王都被消滅了。即使在這種情況下，迦南南部的諸王仍然向以色列人發動戰爭。這是為什麼？如果換成是我們，會怎麼做？</h4></ul>
