	<ul><h3>3. 靈與生命 (創世紀 6: 3)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我們常聽說人生有兩件事是確定的：稅與死亡。關於稅我不太確定。似乎有很多有錢人可以避稅。然而，沒有人能避免死亡。最終，每個人都會死去。由於生活照顧得很好，許多人可以活到超過100歲。然而，沒有人能活過120歲，正如上帝在聖經中所宣告的。上帝真的能這樣掌控我們的壽命嗎？有沒有方法可以改變這一點？</h4></ul>
