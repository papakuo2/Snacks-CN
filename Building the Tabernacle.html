<ul><h3>45. 建造會幕（出埃及記 36: 1 - 7）</h3></ul>
<ul><h3>前言</h3></ul>
<ul><h4>在收到足夠建造會幕的供物之後，比撒列、亞何利亞伯以及所有蒙主賜予技藝和智慧，懂得如何建造聖所的工匠，都應當按照聖經中記載的耶和華所吩咐的一切，參與建造。看來似乎只有他們是建造會幕的功臣。那麼，其他參與獻上供物的會眾呢？他們又得到了怎樣的功勞？至於我們這些因恩典得救的人，我們也獻上了供物。我們又能得到什麼呢？我們如何知道我們的供物被用在了正確的地方呢？</h4></ul>
