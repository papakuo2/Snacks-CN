	<ul><h3>36. 猶大與他瑪（創世記 38: 13 - 18）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在耶穌基督的家譜中列出的四位女性都有一個共同點。她們在生命中都曾經歷極其絕望的處境。她們都在意產業的延續。她們都透過上帝的憐憫得著第二次機會。特別是他瑪，更是如此。我們可能會因她所做的事而論斷她。但在得救之後，我們才明白，我們其實也和她一樣，都是蒙恩得救的人。那麼，我們該如何學習謙卑，好讓我們看見恩典，而不是自以為義呢？</h4></ul>
