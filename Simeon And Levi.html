	<ul><h3>30. 西緬與利未（創世記 34: 20 - 26）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我們可能會認為西緬和利未對示劍以及城中的人所做的事極其殘忍。僅僅因為示劍冒犯了他們的妹妹底拿，他們不僅殺了示劍，還殺了城中所有的男性。就連雅各後來也批評他們的暴力行為。利未的後代也非常暴力。他們按照上帝的命令殺了許多以色列人，因為他們敬拜金牛犢。然而，上帝卻揀選利未人歸於祂，專門事奉祂。如果我們想要事奉上帝，那麼我們可以從利未人身上學到什麼呢？/h4></ul>
