	<ul><h3>4. 大祭司（希伯來書 2:14 - 18）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝賜給以色列人祂的律法，讓他們遵守。他們若不遵守就會犯罪。因此，他們需要獻上祭物，並由大祭司來為他們贖罪。後來耶穌來了。聖經啟示祂就是那隻羔羊，同時作為大祭司親自獻上自己作為祭物，一次且永遠地贖了我們的罪。特別是在聖殿被毀之後，這一點更加明確。因此，我們是否知道如何接受這個真理，讓大祭司不僅拯救我們，也持續在生活中幫助我們呢？</h4></ul>
