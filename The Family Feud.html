	<ul><h3>20. 家族爭端（創世紀 27: 6 - 10）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>家族之間發生爭執並不是什麼新鮮事。我們大家都經歷過。然而，對亞伯拉罕家族來說，這是一場家族爭端。有時情況非常激烈，甚至有家庭成員想要殺死另一位家族成員。為什麼上帝允許這樣的事情發生？這種情況會發生在我們自己的家庭中嗎？上帝不是應該帶給我們平安而不是混亂嗎？上帝想要我們學習什麼樣的信息？</h4></ul>
