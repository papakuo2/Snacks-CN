	<ul><h3>28. 敬拜上帝的律法（出埃及記 23: 20 - 24）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝賜給以色列人誡命和律法，要他們單單事奉並敬拜祂。上帝也應許要帶領他們進入迦南，若他們單單事奉祂，便要賜福他們的生計。然而，歷史顯示這並沒有維持太久。在上帝所應許的迦南地安頓之後，以色列人轉而敬拜迦南人的異教神明。似乎上帝的應許與祝福既已實現，他們便不再有動力遵守誡命了。這樣的事是否也可能發生在我們身上呢？我們是否像以色列人一樣，只是為了滿足自己的需要而敬拜上帝？若是如此，那我們該怎麼做呢？</h4></ul>
