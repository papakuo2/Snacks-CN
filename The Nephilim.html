	<ul><h3>4. 拿非利人 (創世紀 6: 4 - 8)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我們常把實力懸殊的對決稱為大衛對抗歌利亞，因為大衛只是個普通的年輕人，而歌利亞在當時卻是個巨人。以色列人在試圖進入迦南時，也曾遇到那些被稱為拿非利人的巨人。因此，歌利亞很有可能就是拿非利人。我們在現實生活中或許不會遇到拿非利人。然而，在屬靈爭戰中，我們卻很可能像大衛一樣，遇到如同拿非利人的對手。那麼，如果真的發生了，我們該如何預備自己呢？</h4></ul>
