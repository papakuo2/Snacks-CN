<ul><h3>39. 洗濯盆、膏油與香（出埃及記 30: 18 - 21）</h3></ul>
<ul><h3>前言</h3></ul>
<ul><h4>在命令摩西建造會幕之前，上帝已經在西乃山上向摩西展示了會幕的樣式。如今，就連銅盆、膏油和香這類小物件，上帝也詳細指示摩西如何製作。那麼，我們該如何理解這些物件的屬靈意義，並將它們應用到我們的靈修實踐中呢？</h4></ul>
