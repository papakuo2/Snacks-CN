	<ul><h3>19. 完全（希伯來書 10:11 - 18）</h3></ul>
	<ul><h3>前言</h3></ul> 
	<ul><h4>罪被饒恕是一回事，被遺忘又是另一回事。我們的罪債不僅因耶穌基督的獻祭而得以償付，也因被祂的血遮蓋而被遺忘。這就是為什麼我們能在上帝面前被分別為聖並得以完全。然而，我們的肉體仍然讓魔鬼提醒我們的過犯。因此，我們仍然活在良心的控告之下。我們甚至試圖用自己的方法來使良心得著平安。那麼，我們怎麼才能真正確信自己因耶穌基督一次的獻上就已被分別為聖並得以完全呢？</h4></ul>
