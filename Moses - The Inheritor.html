	<ul><h3>28. 摩西－承繼者（希伯來書 11: 23 - 29）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>摩西，上帝的僕人，完成了許多驚人的事蹟。他在完成十災之後帶領以色列人出埃及，穿越紅海，寫下十誡，在曠野中帶領超過一百萬以色列人漂流四十年。然而，他形容人生不過是勞苦愁煩，轉眼飛逝。是因為上帝說他不能帶領以色列會眾進入迦南地嗎？還是因為他領悟到自己只是作為上帝永恆旨意中的承繼者，完成了那些任務？</h4></ul>
