	<ul><h3>7. 巴別塔 (創世紀 11: 4 - 7)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>人們喜歡建造所謂的最高建築。如果不是在世界上，那就在國家裡。如果不是在國家裡，那就在州裡。如果不是在州裡，那就在城市裡。如果不是看得見的建築，那就是財富、權力、名聲等等。換句話說，就是為了讓自己出名。因為每個人的心中都有一座巴別塔。這真的值得嗎？如果不值得，那我們應該做什麼？</h4></ul>
