	<ul><h3>5. 回到埃及（出埃及記 4: 19 - 23）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>摩西逃離埃及到米甸，因為他被自己的同胞以色列人以及他在其中長大的埃及人雙方都拒絕了。現在，上帝呼召他回到埃及，帶領以色列人回到上帝所應許的土地。難怪他對這個呼召感到猶豫。我們也常常如此。在得救之後，我們被基督呼召，要時時在世上為祂作見證。既然如此，我們可以從上帝對摩西的呼召中學到什麼呢？</h4></ul>
