	<ul><h3>46. 約瑟的和解 (創世記 45: 1 - 5)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在看見他的兄弟們因他們對他所做的惡事而改變之後，約瑟終於與他的兄弟們和好，並放聲痛哭。也許是他的苦難終於得到了回報，正如上帝在他的夢中所啟示的那樣。又或者是他終於明白了上帝對這個家庭的旨意。無論如何，這段實現的過程都伴隨著一段痛苦的旅程。為了與祂和好，上帝也在那些蒙祂恩典得救的人身上做著同樣的工作。因此，我們知道如何為這屬靈的旅程預備自己嗎？</h4></ul>
