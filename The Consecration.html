<ul><h3>37. 分別為聖（出埃及記 29: 1 - 9）</h3></ul>
<ul><h3>前言</h3></ul>
<ul><h4>為了侍奉上帝，成為祂的祭司，亞倫和他的兒子們需要按照上帝的吩咐接受分別為聖的儀式。他們需要預備一些牲畜，潔淨自身，穿上相應的聖衣，並為自己向上帝獻上若干祭物。這應成為他們世世代代定期舉行的分別為聖儀式。至於我們這些因恩典得救的人，聖經說我們也可以成為上帝的祭司。那麼，我們該如何分別為聖呢？分別為聖之後，接下來該做什麼呢？</h4></ul>
