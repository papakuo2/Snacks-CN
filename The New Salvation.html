	<ul><h3>2. 救恩（希伯來書 2: 1 - 4）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>為了讓他們得救，上帝賜給以色列人祂的律法，要他們遵守。然而，情況並不理想。以色列人不斷地違背上帝。現在，聖經告訴我們，我們可以藉著接受基督為救主而得救。我們如何知道救恩能改變我們的生命，使我們不再違背上帝呢？</h4></ul>
