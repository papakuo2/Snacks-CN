	<ul><h3>53. 一個新的開始（創世記 50: 15 - 21）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>當雅各死後，約瑟讓他的兄弟們不要因為他們所做的事而害怕，因為上帝的意思原是好的。在約瑟自己臨終之前，他告訴他的兄弟們：「上帝必定眷顧你們，領你們從這地上去，到他向亞伯拉罕、以撒、雅各起誓所應許的地。」這就是信心。他從未忘記上帝立約對這個家族所作的應許，並提醒家人要期待新的開始。上帝也藉著耶穌基督與我們立了約。我們知道那是什麼，以及如何期待它嗎？</h4></ul>
