	<ul><h3>21. 故意犯罪（希伯來書 10: 26 - 31）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝賜下誡命，包括為以色列人所犯的無意之罪設立贖罪祭，使他們可以遵行。然而，經文中並沒有提到為蓄意所犯之罪的規定。因此，如果是蓄意犯下的罪，就沒有祭物或供物可以用來救贖它。也就是說，那樣的罪將無法得到赦免。那麼，我們該如何判斷並避免故意犯罪呢？</h4></ul>
