	<ul><h3>16. 亞伯拉罕的救贖 (創世紀 22: 1 - 2)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>摩西告訴以色列人要遵守上帝的律例和誡命，好讓他們和他們的子孫得以昌盛，並在上帝所應許的土地上長久居住。看起來，上帝是在要求以色列人藉由順服祂和祂的律法來回報恩情。當上帝要求亞伯拉罕獻上以撒時，似乎也是在要求亞伯拉罕回報恩情。然而，亞伯拉罕毫不質疑地順服了。結果，他不但沒有失去以撒，反而因經歷了上帝豐盛的憐憫與愛而得著救贖。因此，我們該如何學習順服上帝，不只是為了上帝的緣故，而也是為了我們自己的益處呢？</h4></ul>
