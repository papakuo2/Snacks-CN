	<ul><h3>2 - 該隱與亞伯 (創世紀 4: 3 - 8)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我曾經在德州大學校園旁看到一家名為「該隱與亞伯」的咖啡店。我想這說明了人們對這個聖經故事有多熟悉。如果像那樣的殺戮暴行都可能發生在一個家庭裡，那麼如今世界上會發生這麼多可怕的事情也就不足為奇了。那麼，我們要如何從這個故事中學習，並為自己做好準備去面對這個世界呢？</h4></ul>
