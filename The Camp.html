	<ul><h3>37. 出到營外（希伯來書 13: 8 - 13）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我們每個人都有屬於肉體的舒適圈。即使舒適圈可能各不相同，我們也可能把它發展成一個堅固的營地，甚至是一座營壘。因此，它常常成為我們跟隨基督的阻礙。那麼，我們是否了解自己的營地，以及如何出到營外？</h4></ul>
