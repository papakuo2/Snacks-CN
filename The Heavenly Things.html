	<ul><h3>17. 天上的樣式（希伯來書 9: 23－28）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>聖經中有許多事物是天上樣式的影子，例如聖殿本身以及其中所使用的各樣器具。對於屬世的事物與約，它們都需要藉著血來潔淨。這就是為什麼基督必須流出祂的血作為祭物，因為唯有祂的血才具有如此深遠的能力，可以成就上帝的公義與聖潔，使之得以完全。得救之後，我們是否也感覺我們的生命同樣是天上之事的影子？如果是，那麼又是如何呢？</h4></ul>
