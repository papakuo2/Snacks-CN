	<ul><h3>4. 立石为记 （約書亞記 4: 1 - 7）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>以色列人過了約旦河之後，上帝吩咐他們從抬普天下主耶和華約櫃祭司腳站立的河中取十二塊石頭，每個支派一塊，帶過來，放在他們當晚住宿的地方。這些石頭僅是用來紀念的嗎？還是另有意義？如果是，那又是什麼？此外，十二塊紀念石與現今因恩典而得救的人有何關聯？</h4></ul>
