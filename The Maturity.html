	<ul><h3>11. 成熟（希伯來書 6: 1 -  8）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>得救之後，我們透過聖經中的話語來認識上帝。不只是要認識祂，上帝也希望我們按照祂的旨意成長，達到成熟。那麼，我們如何知道要按照上帝的旨意成長，而不是依照我們自己的肉體和知識，也就是善惡知識呢？</h4></ul>
