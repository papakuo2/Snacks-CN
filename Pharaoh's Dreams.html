	<ul><h3>40. 法老的夢（創世記 41: 16 - 24）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>人們常說，只要沒有把你擊倒的事，都會塑造你的品格。這句話未必正確，除非是出於上帝。這正是約瑟所經歷的。經過幾次起伏之後，他的生命終於走向成熟。當他為法老解夢時，他不僅給出答案，也提供了解決方案。結果，他整個人生被翻轉了。在我們得救之後，我們也有從上帝而來的聖靈作為我們的中保和安慰者。所以，我們該如何讓聖靈也翻轉我們的人生呢？</h4></ul>
