	<ul><h3>50. 以色列為四位年長的兒子祝福（創世記 49:1 - 12）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>自從他以為約瑟已經死了之後，雅各似乎與上帝失去了連結。聖經沒有記錄他說過或做過任何事，直到他被告知約瑟其實還活著。然而在他生命的最後幾天，他能為所有兒子預言未來。特別是關於彌賽亞將出自猶大後裔的預言。因此，儘管他外在保持沉默，他內在的靈卻持續成長。得救之後，我們也可以被聖靈感動與啟發。因此，我們是否知道如何理解並順服聖靈呢？</h4></ul>
