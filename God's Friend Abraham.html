	<ul><h3>13. 上帝的朋友亞伯拉罕 (創世紀 18: 16 - 18)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝需要一個人作為祂的朋友嗎？然而，上帝稱亞伯拉罕為祂的朋友。那麼，如何成為上帝的朋友呢？一個人能做什麼來幫助上帝呢？同樣的問題也適用於我們。聖經說基督耶穌稱我們為祂的弟兄，這比成為祂的朋友還要更親近。那麼，這代表什麼呢？我們能從亞伯拉罕學習如何成為基督的弟兄嗎？</h4></ul>
