	<ul><h3>35. 烈火（希伯來書 12:25-29）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>聖經向我們描述上帝如同烈火，是一位忌邪的上帝，祂切切地以嫉妒的心渴望祂的靈能住在我們裡面。上帝像吞噬的烈火，並不是要讓人感到恐懼而遠離祂，而是出於祂的愛要潔淨我們，使我們得以被建立在祂那不能震動的國度中。那麼，我們該如何接納這位充滿愛、如同烈火的上帝，使我們被建造成祂那不能震動的國度呢？</h4></ul>
