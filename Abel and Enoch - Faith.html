	<ul><h3>23. 亞伯與以諾 - 信心（希伯來書 11: 1 - 6）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>眼見為憑。這就是我們建立信念的方式。對於看不見的事物，我們從所見之物中推導出信念。對於看不見的上帝，我們看見了祂的創造。那麼，為什麼仍然有這麼多不信的人，甚至無神論者呢？以色列人在歷史中看見了上帝的奇事與神蹟，然而上帝卻說他們仍然不相信祂。為什麼？</h4></ul>
