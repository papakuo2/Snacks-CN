	<ul><h3>2. 摩西的起源（出埃及記 2: 5 - 10）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>摩西是一名以色列人。然而，他的名字「摩西」是由法老的女兒所取，意思是他是從水中被拉出來的。因此，他的名字同時與以色列人和埃及人都有關聯。似乎上帝從一開始就為摩西預備，使他既與以色列人，也與外邦人有所連結，以完成一項使命。那麼，上帝是如何預備摩西來完成這項使命的呢？我們可以從摩西身上學到什麼？</h4></ul>
