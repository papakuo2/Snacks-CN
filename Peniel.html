	<ul><h3>28. 毗努伊勒（創世記 32: 24 - 31）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我們幾乎無法想像雅各竟然能與上帝摔跤並且獲勝。然而天使確實是這麼說的。或許雅各克服了一切困難，興起並帶回以色列十二支派的先祖回到迦南。連上帝都不得不佩服他。使徒保羅也有類似的經歷，他說自己在肉身中受苦，要補滿基督患難所欠缺的。我們知道他的意思並不是說他受的苦比基督更多，而是因著他的受苦，福音與教會得以擴展。那麼，我們可以從他們身上學到什麼呢？</h4></ul>
