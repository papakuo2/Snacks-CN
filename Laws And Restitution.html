	<ul><h3>24. 律法與賠償（出埃及記 21: 1 - 6）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在十誡之後，上帝繼續頒布律法，來處理奴役、衝突、賠償等等問題。問題在於，人是複雜的，因為每個人都有自己根據那詭詐的善惡知識所形成的判斷。所以，律法能夠解決每一個案件嗎？或者，如果雙方都不滿意，那麼賠償的解決方案是什麼？律法的目的又是什麼？</h4></ul>
