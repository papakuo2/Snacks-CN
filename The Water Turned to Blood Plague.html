	<ul><h3>9. 水變血之災（出埃及記 7: 20 - 25）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>為了打破法老不讓以色列人離開的意志，上帝命令摩西和亞倫施行第一個災，就是把埃及所有的水變成血。儘管這確實造成了一些生活上的混亂，卻沒有動搖法老的意志。那麼，為什麼上帝要這樣做呢？我們可以從第一個災學到什麼真正的意義？</h4></ul>
