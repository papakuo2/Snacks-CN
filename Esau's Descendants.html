	<ul><h3>33. 以掃的後裔（創世記 36: 1 - 5）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝祝福以撒，因為他是亞伯拉罕的妻子撒拉所生的。然而，上帝也祝福了以實瑪利，他是亞伯拉罕另一位妻子夏甲所生的。類似的事情也發生在雅各和以掃身上。即使上帝一開始揀選了雅各，祂仍然使以掃成為一個強大的族群。這就像上帝也同樣祝福我們這些得救的外邦人，與以色列人—被揀選的子民—一樣。那麼，為什麼會這樣呢？我們又該如何活出配得這祝福的人生呢？</h4></ul>
