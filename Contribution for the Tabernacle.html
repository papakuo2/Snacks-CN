<ul><h3>44. 為會幕奉獻（出埃及記 35: 5 - 10）</h3></ul>
<ul><h3>前言</h3></ul>
<ul><h4>既然上帝創造萬物，擁有萬物，我們或許會想，上帝為何需要以色列人來製作祂居所－會幕－所需的器物？或者，對我們這些因恩典得救的人來說，為何還需要向上帝獻祭，例如什一奉獻？因恩典得救意味著我們一切罪債都已藉著基督耶穌的犧牲而得以償清。那麼，我們為何還需要向上帝奉獻呢？如果我們奉獻，我們能得到什麼？如果我們不奉獻，我們又會怎樣？</h4></ul>
