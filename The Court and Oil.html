<ul><h3>35. 會幕的院子與油（出埃及記 27: 9 - 13）</h3></ul>
<ul><h3>前言</h3></ul>
<ul><h4>上帝命令以色列人建造的會幕，不僅是為以色列人而建，也是為所有因信稱義的人而建。即使是像院子和燈台上的油這樣看似普通微不足道的物件，也都蘊含著重要的屬靈訊息。那麼，我們如何才能明白這些信息是什麼呢？或者說，我們如何知道這些信息不僅適用於以色列人，也適用於那些接受耶穌基督為救主而得救的人呢？</h4></ul>
