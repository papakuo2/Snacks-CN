	<ul><h3>39. 阿們, 阿們！（希伯來書 13: 20 - 25）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>人生中最不可少的是什麼？我們可能有各自的定義。在聖經中，耶穌對馬大說，有一件事是不可少的。馬利亞選擇了那上好的福分，是不能奪去的。得救之後，上帝賜給我們信心，期望我們像馬利亞一樣，委身於基督，愛祂並聽祂。如果我們做到這一點，我們就像馬利亞選擇了人生中那不可少上好的福分了。阿們, 阿們！</h4></ul>
