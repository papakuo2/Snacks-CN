	<ul><h3>7. 安息（希伯來書 4: 1 - 5）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>如果我們不順服上帝，就沒有安息或平安。即使我們嘗試順服，我們仍然得不到安息。只要我們仍然活在分別善惡知識的肉體中，情況就是如此。因為善與惡的知識會不斷在我們的肉體中爭戰。所以，我們的出路是什麼呢？</h4></ul>
