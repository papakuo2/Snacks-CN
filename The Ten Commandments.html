	<ul><h3>23. 十誡（出埃及記 20: 1 - 17）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我們都知道或聽過十誡。然而，人卻如同以下聖經所描述的那樣彎曲敗壞。
	<ul><h4>
人心比萬物都詭詐，壞到極處，誰能識透呢？（耶利米書 17: 9）
	</h4></ul>
十誡真的能幫助人嗎？對於我們這些因耶穌基督、靠恩典得救的人來說，我們還需要像以色列人一樣遵守十誡嗎？如果需要，那我們能比他們做得更好嗎？如果不需要，那我們的出路又是什麼呢？</h4></ul>
