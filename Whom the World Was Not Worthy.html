	<ul><h3>30. 世界不配有的人（希伯來書 11: 32 - 40）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在聖經中，許多人都展現了他們的信心。即使是在士師記那黑暗的年代也是如此。因著信心，他們沒有與世界妥協，被世界壓制。因此，他們都得在各種不同的方式中受苦。他們是如何得著信心，以至於知道這世界不配有他們的呢？我們又該如何領受同樣的信心，使我們在人生中得勝呢？</h4></ul>
