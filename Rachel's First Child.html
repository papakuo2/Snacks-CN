	<ul><h3>24. 拉結的第一個孩子 (創世記 30: 22 - 28)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我們不喜歡等待。在不知道是否會有結果的情況下等待，可能是最難以忍受的事。亞伯拉罕在以撒出生之前等了25年。至少他知道自己會得到後裔，因為那是上帝所應許的。至於拉結，她的等待更為艱難，因為沒有人能給她任何會有孩子的應許。尤其是在看到雅各的其他妻子已經生了好幾個兒子之後。最終，她懷了一個兒子約瑟，後來約瑟拯救了雅各的整個家族。那麼，有沒有什麼方法可以幫助我們學習等待呢？</h4></ul>
