	<ul><h3>17. 以法蓮和瑪拿西分的地業 (約書亞記 16: 1 to 4)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>猶大支派先分得了土地，接著是約瑟的兒子們－以法蓮支派和瑪拿西支派。不僅如此，他們各自都分得了大片土地。這些土地是如何分配的？是由約書亞獨自決定的嗎？各支派對於所分得的土地會有怎樣的反應？從目前的土地分配情況中，我們又能得到什麼啟示呢？</h4></ul>
