	<ul><h3>42. 約瑟與他的兄弟相見（創世記 42: 6 - 9）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>約瑟在埃及功成名就之後，沒有回到迦南去與家人相見，這其實並不太尋常。從埃及到迦南的路程並不遙遠。此外，即使他的兄弟就站在他面前，他也並不急於表明自己的身分。為什麼會這樣？他在等待什麼？我們可以從他的耐心中學到什麼？</h4></ul>
