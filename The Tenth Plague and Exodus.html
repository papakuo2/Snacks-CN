	<ul><h3>16. 第十災與出埃及（出埃及記 12: 29 - 33）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在第十災之後，法老終於讓以色列人離開。然而，埃及人失去了他們頭生的男子與牲畜。以色列人則不得不離開自己的家園，開始一段出埃及的旅程。因此，看起來似乎沒有人是贏家。然而，如果我們能夠明白上帝的計畫，那麼我們就會知道，這不僅影響了以色列人，也影響了今日的信徒。所以，在上帝的計畫之下，我們要如何才能得勝呢？</h4></ul>
