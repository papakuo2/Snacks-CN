	<ul><h3>14. 更美之約（希伯來書 8: 6 - 12）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝與老一輩的以色列人立約，要他們遵行祂的律法。然而，他們沒有持守自己的本分。因此，上帝不再顧念他們，並與新一代以色列家和猶大家另立新約。不同於舊約只是照著律法的字面去遵行，新約是上帝將律法放在他們的心思意念中，使他們能用心去認識上帝，並理解律法。因著基督，我們成為猶大家的一部分。那麼，我們是否知道如何理解律法，來認識上帝呢？</h4></ul>
