	<ul><h3>17. 過紅海（出埃及記 14: 15 - 18）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>為了讓法老王放以色列人離開，上帝降下了十災在埃及。為了帶領以色列人出埃及進入迦南，上帝也行了許多神蹟。上帝是全能且可畏的，如下所述。
	<ul><h4>
願全地都敬畏耶和華；願世上的居民都懼怕他！因為他說有，就有；命立，就立。（詩篇 33:8-9）
	</h4></ul>
然而，為什麼上帝常常選擇用艱難的方式行事？從分開紅海開始，上帝為什麼不替以色列百姓鋪設一條輕鬆的出埃及之路？上帝想要教導以色列人什麼？我們又能從中學到什麼？</h4></ul>
