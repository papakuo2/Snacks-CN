	<ul><h3>34. 約瑟的夢（創世記 37: 3 - 11）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>約瑟和他的兄弟們相處得不好。他所做的兩個夢讓情況變得更糟。在夢中聽到全家都要向約瑟下拜之後，他的兄弟們決定殺了他。他沒有被殺，而是被迫離開家族流亡了22年。在那些年間，他成為埃及的宰相。他也獲得了解釋奇異夢境的智慧，也許也包括他自己的夢。這大概就是他把雅各的整個家族遷到埃及的原因。在被拯救之後，我們是否有智慧更好地理解上帝的旨意？</h4></ul>
