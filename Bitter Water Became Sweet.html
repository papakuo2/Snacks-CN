	<ul><h3>18. 苦水變甜水（出埃及記 15: 22 - 27）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>水對生命至關重要，尤其是在沙漠中。它可能意味著生與死。所以，當以色列百姓找不到可飲用的水，因為水是苦的時，他們驚慌並抱怨。這是可以理解的。於是，上帝告訴摩西把一棵樹丟進水裡。然後，苦水就變甜了。我們其實就像以色列人一樣。我們常常遇到苦澀的處境，迫切需要一個解決方法。所以，我們該怎麼做？我們又能在哪裡找到那棵能扭轉局勢的樹呢？</h4></ul>
