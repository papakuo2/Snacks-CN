	<ul><h3>48. 雅各的埃及之旅（創世記 46: 1 - 4）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>當上帝呼召亞伯拉罕離開吾珥、進入應許之地迦南時，我們可能會好奇，迦南到底有什麼特別之處？如今，在約瑟成為埃及的宰相之後，上帝又呼召雅各前往埃及。我們可能會疑惑，為什麼又要遷移？如果我們明白上帝的公義與慈愛，我們就會驚訝於上帝從未停止按照祂的旨意，將以色列人建立成為一個特別的民族，使他們領受更多的祝福。同樣的事情也發生在基督的教會中。因此，作為教會的一員，我們該如何學習該做什麼，才能領受賞賜呢？</h4></ul>
