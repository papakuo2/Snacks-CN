	<ul><h3>34. 祭壇（出埃及記 27: 1 - 8）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>祭壇在人們與他們所崇拜的神之間的宗教世界中扮演著重要的角色。人們主要使用祭壇來獻上祭品，以取悅他們的神。我們全能的主上帝也命令以色列人在會幕院中建造祭壇。然而，除了像其他宗教一樣獻祭以取悅上帝之外，祭壇還有更深的意義嗎？如果有，那它的意義是什麼，我們應該如何對待祭壇？</h4></ul>
