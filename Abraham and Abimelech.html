	<ul><h3>14. 亞伯拉罕與亞比米勒 (創世紀 20: 3 - 5)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>雖然我們已經得救，但我們仍然活在這個世界上。和從前一樣，我們仍然可能遇到危險、挑戰、試探等等。我們是否能比以前更好地應對這些事情呢？亞伯拉罕也有同樣的經歷。他有信心，也是上帝的朋友。然而當他面對危險時，他仍然做了我們也可能會做的事。他是缺乏信心嗎？像他一樣選擇走容易的路對我們來說可以嗎？我們可以從亞伯拉罕的真實人生經歷中學到什麼？</h4></ul>
