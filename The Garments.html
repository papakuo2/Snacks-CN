<ul><h3>36. 聖衣（出埃及記 28: 1 - 5）</h3></ul>
<ul><h3>前言</h3></ul>
<ul><h4>起初，上帝與亞當和夏娃同在伊甸園。當他們犯罪後，上帝製作了皮衣給他們穿上，然後將他們從伊甸園趕出去。現在，上帝再次要與人同在，命令摩西為亞倫製作聖潔的禮服，為了榮耀和美麗。以色列人是亞當和夏娃的後裔。這一次有何不同呢？是什麼改變了上帝對人的態度？我們應如何理解大祭司的聖衣對我們的重要性？ </h4></ul>
