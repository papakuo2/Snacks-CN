	<ul><h3>15. 約旦河西的產業 (約書亞記 14: 2 - 5)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>以色列的兩個半支派按照他們的要求，繼承了約旦河以東的土地。其餘九個半支派需要抽籤來繼承約旦河西的土地。各支派之間能否公平分配？接著，迦勒向約書亞請求希伯崙。各支派都沒有異議，約書亞就祝福迦勒，以希伯崙為他的產業。那麼，我們能想像如果這件事發生在今天，會是什麼情況嗎？我們可以從以色列人的態度中學到什麼？</h4></ul>
