	<ul><h3>6. 挪亞的子孫 (創世紀 9: 20 - 27)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我曾經讀過一篇文章叫做「我們無法選擇父母，但父母選擇了我們的命運」。它描述了父母如何對待孩子，從而影響孩子的一生。這在挪亞的兒子身上非常真實。挪亞曾經喝醉過一次。根據他兒子的反應，他詛咒了含的後代迦南，並祝福了閃和雅弗的後代。歷史顯示事情正是如此發展的。即使在今天，這仍然是真的。那麼，有沒有方法可以改變這一切？如果有，要怎麼做？</h4></ul>
