	<ul><h3>6. 耶和華的軍隊 （約書亞記 5: 13 - 15）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>摩西帶領以色列人出埃及，過紅海後，在西奈沙漠流浪了 40 年。在那段時間裡，他們就像一群不服從、叛逆的人，上帝因此斥責他們。在渡過約旦河之後，上帝稱他們為耶和華的軍隊。那麼，他們是如何從一種變成另一種的呢？此外，成為耶和華的軍隊。意味著一個人可以在世上得勝。這在當今我們的身上可能發生嗎？如果可以，那該如何做？</h4></ul>
