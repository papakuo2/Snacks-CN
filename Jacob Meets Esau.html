	<ul><h3>29. 雅各與以掃相見（創世記 33: 4 - 11）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>儘管以掃毫不在意地把長子名分賣給了雅各，但當他得知雅各奪走了他的祝福時，他仍然感到絕望並想要殺死雅各。因此，看起來他其實是很在意的。然而，當他最終與雅各相見時，他似乎對雅各所做的事已經不再介意，因為他已經擁有足夠了。相反地，雅各則透過將大量財富送給以掃、稱以掃為他的主、並且七次俯伏在地直到接近他的哥哥以掃，表現出真誠的悔改。我們可以從這兩種不同的態度中學到什麼？</h4></ul>
