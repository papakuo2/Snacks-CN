	<ul><h3>1. 使命（約書亞記 1: 1 - 9）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在上帝的命令下，摩西帶領以色列人離開埃及。現在，40 年後，上帝命令約書亞帶領以色列人進入迦南。上帝並沒有在以色列人離開埃及後立即帶領他們進入迦南，而是讓他們在曠野中徘徊了 40 年。那是因為上帝不僅想訓練以色列人成為祂的偉大軍隊，也想訓練約書亞成為一位偉大的領袖。因此，我們可以從《約書亞記》中學習如何成為上帝所訓練有素的戰士和領袖。那麼，上帝會為我們帶來這樣的渴望嗎？</h4></ul>
