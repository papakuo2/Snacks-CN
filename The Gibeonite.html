	<ul><h3>10. 基遍人 (約書亞記 9: 1 - 6)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>以色列人奉上帝之命，屠殺了耶利哥和艾城中除喇合及其家人以外的所有人。這是因為喇合曾與以色列探子達成協議，幫助他們逃出耶利哥。基遍人或許從喇合身上學到了什麼。於是，他們假裝來自遙遠的地方，不會傷害以色列人，以此誘使以色列人與他們立約。後來，他們的詭計被識破，但以色列人還是放過了他們，因為他們承諾為全會眾砍柴挑水。後來，聖經記載，連上帝也信守了這個約。那麼，我們能從基遍人身上學到什麼呢？</h4></ul>
