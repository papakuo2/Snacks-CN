	<ul><h3>7. 耶利哥的陷落 （約書亞記 6: 1 - 7）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在渡過約旦河之後，上帝命令約書亞帶領以色列人攻佔耶利哥。然而，上帝並沒有讓約書亞所見的天使，也就是耶和華軍隊的元帥，帶領他們攻打這座城，而是吩咐他們每天繞城一次，然後在第七天繞城七次。如果他們能夠一天繞城七次，那麼這座城不會太大。所以，用武力攻佔這座城應該不難。為什麼上帝反而選擇了如此奇怪的策略？此外，城牆怎麼可能因為他們的大聲吶喊而完全倒塌？我們可以從整個事件中學到什麼？</h4></ul>
