	<ul><h3>25. 雅各的枝條（創世記 30: 37 - 39）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我們常常會想，魔杖是否真的存在。毫無疑問，雅各擁有最有價值的「魔杖」——剝了皮的枝條。它們能把拉班所有純白的羊群，變成有斑點或有花紋的山羊，以及深色的小羊，以致所有的羊群都成了雅各的工價，正如拉班所同意的那樣。摩西也曾把一條銅蛇掛在杆子上，使以色列人能望向它而得醫治。同樣改變生命的力量，也被轉移到釘死主耶穌的木十字架上。那麼，我們該如何「仰望」十字架來轉變我們的生命呢？</h4></ul>
