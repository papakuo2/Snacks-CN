	<ul><h3>10. 亞伯蘭屬天的後裔 (創世紀 15: 5 - 6)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>當有人向我們做出承諾時，我們希望看到它們被實現，而且越快越好。當上帝向亞伯蘭應許後裔和所有土地時，亞伯蘭將無法親眼看見這些實現。然而，這並沒有困擾他。他仍然活在這些應許之中，並將信心放在上帝身上。正因如此，他的信心才能一天天變得更加堅定。我們是如何知道的呢？我們能從中學到什麼嗎？</h4></ul>
