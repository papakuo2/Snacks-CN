	<ul><h3>25. 偷盜與姦淫的律法（出埃及記 22: 1 - 8）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>不同於世俗的法律每天變得越來越複雜，關於偷盜與姦淫的律法是簡單且直接的。那麼，這些律法在現今對於如此敏感的議題仍然足夠嗎？或者，我們應該擴充這些律法，使其符合世俗法律，以處理相同的議題？畢竟，律法的目的就是懲罰犯罪者。因此，不應放過任何細節。真的是這樣嗎？如果不是，那麼我們應該以什麼樣的態度來看待律法？</h4></ul>
