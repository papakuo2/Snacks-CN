	<ul><h3>24. 挪亞與亞伯拉罕 - 那座城（希伯來書 11: 7 - 10）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>挪亞見證了毀滅世界的大洪水，這是一場巨大的悲劇。亞伯拉罕也見證了上帝毀滅所多瑪和蛾摩拉，這些是他所熟悉的地方。然而他們仍然對上帝有信心並順服祂。因此，上帝因著他們的信心與他們立約。我們也可能會遭遇難以想像的悲劇。我們如何能從他們身上學習，仍然持守信心呢？</h4></ul>
