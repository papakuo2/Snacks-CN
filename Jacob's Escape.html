	<ul><h3>26. 雅各的逃離（創世記 31: 17 - 21）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我們常常聽說，要取勝就必須積極進取。毫無疑問，拉結非常積極進取。不僅她想盡一切辦法要懷孕，她還在雅各試圖從拉班家逃離時，偷走了她父親拉班的家中神像。即使這使家人和她自己都陷入危險之中，但她的積極性或許鼓勵了雅各和全家在返鄉途中面對敵對的處境。今天，在得救之後，我們不再依靠自己的積極進取，而是依靠信心。那麼，我們該如何將我們的積極進取從肉體轉化為屬靈的信心呢？</h4></ul>
