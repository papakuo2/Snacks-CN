	<ul><h3>29. 耶利哥與喇合 - 行走（希伯來書 11: 30 - 31）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>正如《聖經》中所描述，以色列人每天繞著耶利哥城走一次，持續六天。在第七天，他們繞城走七次。然後他們一起大聲呼喊，城牆便倒塌了。這怎麼可能呢？此外，一位卑微的耶利哥妓女喇合又是如何在這樣的浩劫中存活下來的？我們又該如何從耶利哥所發生的事情中學習，並將其應用在我們的屬靈生命中呢？</h4></ul>
