	<ul><h3>30. 聖所（出埃及記 25: 8 - 9）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝是全宇宙的上帝。然而祂卻要以色列人建造一個聖所，好讓祂可以住在他們當中。上帝可以隨時隨地在任何地方。為什麼祂需要一個由人手所建造的聖所呢？上帝創造了伊甸園，好讓祂能與他們同在。然而事情並沒有進展得很好，因為亞當和夏娃違背了上帝，吃了禁果。這一次又怎能不同，特別是在面對以色列這樣龐大的人口時？我們又該如何更深入理解上帝的心意呢？</h4></ul>
