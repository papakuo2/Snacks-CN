<ul><h3>47. 會幕的完成（出埃及記 40: 1 - 9）</h3></ul>
<ul><h3>前言</h3></ul>
<ul><h4>上帝命令以色列人建造會幕，好讓祂住在他們中間。會幕建成後，上帝的榮光充滿了會幕，摩西甚至無法進入。那時，在以色列全家的眼前，在整個旅程中，白天上帝的雲彩在帳幕上，夜晚雲中有火。如今我們這些蒙恩得救的人，該如何建造會幕，好讓上帝住在我們中間呢？我們又該如何找到上帝的雲彩來引領我們走完人生的旅程呢？</h4></ul>
