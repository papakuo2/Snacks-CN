	<ul><h3>3. 燃燒的荊棘（出埃及記 3: 2 – 10）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝可以透過夢境、徵兆、話語等方式向我們傳達祂的信息。燃燒的荊棘在某些人心中或許就如同優勝美地的「火瀑」一般壯觀。然而，摩西知道那是上帝給他的記號。一個伴隨著上帝訊息的記號，不僅喚醒了他以色列人的心，也建立了他與上帝之間緊密的連結。因此，當上帝向我們顯現祂的記號或話語時，我們是否也能體會到這樣的經歷呢？</h4></ul>
