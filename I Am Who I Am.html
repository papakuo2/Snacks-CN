	<ul><h3>4. 我是自有永有的 (出埃及記 3: 13 - 17)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>當摩西詢問上帝的名字時，上帝回答「我是自有永有的」，這表示獨一無二且永恆自存的存在，這個名字讓惡魔顫抖，也使信徒如以下所述得著賞賜。
	<ul><h4>
你信上帝只有一位，你信的不錯；鬼魔也信，卻是戰驚。(雅各書 2:19)
	</h4></ul>
	<ul><h4>
因為到上帝面前來的人，必須信有上帝，且信他賞賜那尋求他的人。(希伯來書 11:6)
	</h4></ul>
然而，我們對「我是自有永有的」這個名字到底了解多少，以至於能在生命中去追尋它呢？</h4></ul>
