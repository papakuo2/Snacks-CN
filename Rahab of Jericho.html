	<ul><h3>2. 耶利哥的喇合（約書亞記 2: 8 - 14）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在進入迦南之前，約書亞像摩西一樣，派了兩個人去窺探迦南。上帝不是已經應許約書亞要給他迦南地嗎？為什麼約書亞還是需要派遣探子？此外，這項任務並不太成功，因為他們很快就被發現了。如果沒有耶利哥的妓女喇合，他們肯定會被抓。那麼，整個故事的真正目的是什麼？我們能從中學到什麼？</h4></ul>
