	<ul><h3>9. 道（希伯來書 4: 12 - 16）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>一個成功的人懂得如何把別人的錢放進自己的口袋，也懂得如何把自己的想法放進別人的腦袋裡。事實上，後者更難。即使一開始可能會成功，但可能不會持續太久，因為人們都有自己對善與惡的認知，而且總認為自己是好的、正確的。那麼，我們要如何才能相信上帝呢？上帝能做些什麼來改變我們堅強的意志呢？</h4></ul>
