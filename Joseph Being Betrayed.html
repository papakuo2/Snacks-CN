	<ul><h3>35. 約瑟的被賣（創世紀 37: 19 - 24）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>如果人生已經不容易，那麼被出賣只會讓情況更糟。而若是被自己的家人出賣，那將是最糟的情況。這正是約瑟所遭遇的事。聖經沒有描述他的情緒。然而，這並不代表他忘記了。他只是學會在不犧牲自己正直品格的情況下，去面對並承受困難。他沒有被擊倒，反而每天都變得更加有智慧。耶穌也經歷了同樣的背叛，並且得勝。所以，我們該如何學習面對所有逆境，並像上帝的兒女一樣得勝呢？</h4></ul>
