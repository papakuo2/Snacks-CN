<ul><h3>43. 重新立約（出埃及記 34: 5 - 10）</h3></ul>
<ul><h3>前言</h3></ul>
<ul><h4>以色列人因拜金牛犢而犯了拜偶像之罪。上帝並沒有因他們的罪而懲罰他們，反而與以色列人重新立約。這重新立約的內容是什麼？這重新立的約如何幫助以色列人順服上帝？其目的是什麼？對於我們這些因恩典而得救的人來說，我們又該如何從中學習，並將其應用到我們的屬靈生命中呢？</h4></ul>
