	<ul><h3>15. 逾越節（出埃及記 12: 7 - 13）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在以擊殺埃及人長子作為最後一場災禍之前，上帝告訴摩西有關逾越節的事。雖然這最後的災禍只臨到埃及人，以色列人仍然需要宰殺一隻沒有瑕疵的羔羊，並將牠的血塗在房屋的門框和門楣上，好讓上帝「越過」那個房子。這是為什麼呢？我們又該如何將這個原則應用在我們的生活中？</h4></ul>
