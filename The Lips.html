	<ul><h3>38. 嘴唇（希伯來書 13: 14 – 19）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我們接受主耶穌基督作為救主的原因，不僅是因為將來可以承受永生，也包括如今能過敬虔的生活，不再讓被我們詭詐的肉體所操控的嘴唇說出謊言。除了擁有內心的平安過敬虔的生活之外，我們的嘴唇還應該用來做什麼？</h4></ul>
