	<ul><h3>9. 艾城的陷落 （約書亞記 8: 1 - 2）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>由於亞干的罪，以色列人攻打艾城的嘗試以慘敗告終。然而，上帝應許以色列人第二次攻打艾城必成功。與第一次不同的是，上帝這次不只應許他們攻打艾城，還應許他們掠奪城中的財物和牲畜。亞干犯下罪孽，是因為他從耶利哥城取走了當獻的物。那麼，這次又有什麼不同呢？是什麼改變了上帝的態度呢？</h4></ul>
