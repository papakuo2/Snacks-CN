	<ul><h3>39. 酒政與膳長的夢（創世記 40: 9 - 19）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝是公義且正直的。因此，祂會向得救與未得救的人顯明祂的旨意。約瑟為埃及酒政與膳長解夢的情況正是如此。然而，他們仍然需要像約瑟這樣的人來解釋他們的夢。沒有約瑟，他們的夢就毫無意義。後來法老的夢也發生了同樣的事。所以，如果沒有能解釋上帝旨意的人，上帝就不會顯明祂的旨意。如今，我們擁有聖經，其中記載的上帝話語比任何夢都更多。因此，誰能為我們解釋上帝的話語呢？</h4></ul>
