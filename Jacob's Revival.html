	<ul><h3>47. 雅各的復興（創世記 45: 25 - 28）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>當雅各第一次聽到約瑟的死訊時，他並沒有懷疑。因為在他心中，他知道那些兄弟對約瑟的感受。他也知道自己的兒子們能做出什麼樣的事。所以，當他以為最糟的事情已經發生時，他必定非常絕望，以至於沒有採取任何行動去阻止這場悲劇。因此，當他聽說約瑟並沒有死時，他的心重新被振奮起來。因為現在他可以確信上帝對這個家庭以及對約瑟的應許。他終於與上帝和好了。如今，基督正在為祂的教會帶來更大的復興。我們是否知道那是什麼，以及如何為此預備呢？</h4></ul>
