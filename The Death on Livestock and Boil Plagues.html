	<ul><h3>11. 牲畜之死與瘡災（出埃及記 9: 2 - 4）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在四次災禍之後，上帝命令摩西再以兩個災禍擊打埃及：牲畜死亡與長瘡。兩者都造成了身體上的損失與痛苦。如同之前一樣，這些災禍只發生在埃及人身上。然而，這一次上帝並不急於說服法老讓以色列人離開。相反地，上帝使法老的心剛硬，不讓他釋放以色列人。這是為什麼呢？這似乎削弱了災禍的目的。我們可以從上帝的意圖中學到什麼？</h4></ul>
