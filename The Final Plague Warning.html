	<ul><h3>14. 最後的災禍警告（出埃及記 11:2 - 9）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝告訴摩西要警告法老關於最後一場災禍：在埃及擊殺所有長子，包括人和牲畜。上帝也告訴摩西要以色列人向他們的埃及鄰居索取銀器和金器首飾，因為上帝使以色列人在埃及人眼中蒙恩。這似乎是不可能的事。上帝怎麼會像敵人一樣殺死埃及人的長子，卻又像朋友一樣讓埃及人把財富給以色列人？然而，這正是上帝從一開始的計畫。那麼，我們該如何理解它的意義，並在生活中加以應用呢？</h4></ul>
