	<ul><h3>52. 雅各的臨終囑咐（創世記 49: 29 - 33）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>儘管雅各一生充滿活力、進取並且屬靈，他仍然必須像所有凡人一樣面對生命的終點。然而，他以滿足且平靜的心境面對他的最後時光。他的行為彷彿已完成一段旅程，如今可以安然歇息。這就像基督某些門徒生命最後的日子一樣。這樣的安息也為我們這些得救的人預備了。因此，我們現在該如何得著這樣的確據呢？</h4></ul>	<!--<ul><video src="Jacob's last command Video.mp4" controls type="video/mp4" width="400"> </video></ul>-->
