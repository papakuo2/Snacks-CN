	<ul><h3>37. 法勒斯與謝拉（創世記 38: 27 - 30）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>他瑪與猶大同卧後懷孕，生下一對雙胞胎——法勒斯與謝拉。耶穌的祖先出自法勒斯。然而與其他祖先不同的是，法勒斯與謝拉都被列入耶穌基督的家譜中。這是為什麼呢？而且，他們的出生過程相當戲劇化，因此他們的名字也因此而來。我們可以從這段經歷中學到什麼呢？</h4></ul>
