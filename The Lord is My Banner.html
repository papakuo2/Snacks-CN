	<ul><h3>20. 耶和華是我的旌旗（出埃及記 17: 3 - 7）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在何烈山，以色列百姓像以前一樣向摩西發怨言，因為他們在那裡口渴沒有水。後來在利非訂，亞瑪力人來攻擊以色列，與他們爭戰。然而，在戰鬥之後，摩西築了一座壇，並給它起名叫 「耶和華尼西」, 就是「耶和華是我的旌旗」，那麼，是什麼改變了以色列人的態度？從為水發怨言，到與亞瑪力人爭戰卻毫無怨言？這樣的事也會發生在我們身上嗎？如果會，那麼我們該如何確定呢？</h4></ul>
