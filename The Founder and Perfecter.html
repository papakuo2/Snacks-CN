	<ul><h3>31. 創始成終者（希伯來書 12: 1 - 2）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在耶利哥，當撒該在看見主耶穌之後，承諾要把財物分給窮人，並對他所欺詐的人償還四倍時，主耶穌對他說，人子來是要尋找並拯救失喪的人。那麼，如果我們像撒該一樣放下各樣的重擔和罪，基督是否也會來尋找並拯救我們呢？我們要如何仰望主耶穌基督來成我們信心的創始成終者呢？</h4></ul>
