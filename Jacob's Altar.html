	<ul><h3>31. 雅各的祭壇（創世紀 35: 1 - 3）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>在聖經，人們或是按照上帝的吩咐建造祭壇，或是為了記念上帝所成就的事。亞伯拉罕建了四座祭壇，雅各建了兩座。透過那些祭壇，人們理解了上帝的所作所為。然而，有時候，那些祭壇逐漸變成僅僅是宗教的象徵，或被人利用來謀取個人利益。那麼，我們現在還需要建造祭壇嗎？如果需要，那它是什麼？又該如何建造呢？</h4></ul>
