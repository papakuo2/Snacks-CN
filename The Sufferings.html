	<ul><h3>22. 苦難 (Hebrews 10: 32 - 36)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>這個世界充滿患難，因此沒有人能逃避苦難。然而，對非基督徒來說，這只是生活的一部分。對我們基督徒而言，苦難可以轉化為祝福。因此，我們該如何預備自己，從日常的苦難中得著益處呢？</h4></ul>
