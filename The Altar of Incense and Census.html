<ul><h3>38. 香壇與人口普查（出埃及記 30: 1 - 5）</h3></ul>
<ul><h3>前言</h3></ul>
<ul><h4>上帝命令摩西為會幕預備香壇，並進行人口普查。只有經認可的香才能在壇上焚燒。那麼，香壇的目的又是什麼呢？經認可的香又是什麼呢？至於人口普查，上帝曾因大衛王進行人口普查而發怒。為什麼上​​帝命令摩西親自對以色列人進行人口普查呢？對我們今天而言，我們應該如何將香壇和人口普查應用到我們的靈修生活中？</h4></ul>
