	<ul><h3>25. 撒拉 - 後裔（希伯來書 11: 11 - 12）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>信心是給願意順服上帝的人。當我們談到信心時，我們常常想到亞伯拉罕。對撒拉來說也同樣承受壓力，因為她需要以亞伯拉罕妻子的身分承受同樣的試煉。為了讓亞伯拉罕有後裔，撒拉讓亞伯拉罕納她的使女夏甲，因為她自己已經年老不能生育。所以，撒拉是缺乏信心嗎？還是因為她的順服，使上帝應許她能夠懷孕呢？</h4></ul>
