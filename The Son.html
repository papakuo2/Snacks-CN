	<ul><h3>1. 上帝之子 (希伯來書 1: 1 - 4)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>我們過去所信的觀念是依靠自己的直覺，與基於自己的所見。後來我們發現兩者都不可靠，因為它們也可能是多變的。因此，要尋找真理，我們需要找到一個不變的來源。很明顯，這既不在我們的直覺中，也不在這個所見的世界裡。如果我們要在聖經中尋找真理，那麼《希伯來書》是一個很好的起點。它教導我們關於信心以及信心從何而來。首先要認識的是上帝之子。為什麼呢？</h4></ul>
