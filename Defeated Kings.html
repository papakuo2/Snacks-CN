	<ul><h3>13. 被擊敗的眾王 (約書亞記 12: 7 - 24)</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>以色列人擊敗了約旦河東岸的兩位國王和約旦河西岸的 31 位國王。儘管這些國王擁有堅固的堡壘、馬匹和戰車，但聖經並沒有提到以色列人擁有什麼樣的武器。他們甚至按照神的吩咐，砍斷敵人的馬蹄筋，並用火焚燒他們的戰車。因此，他們所擁有的只是步兵和上帝的應許將敵人交在他們手中。如果我們是他們，我們又怎麼知道自己能夠在今日的屬靈爭戰中得勝呢？</h4></ul>
