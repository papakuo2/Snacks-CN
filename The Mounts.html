	<ul><h3>34. 山（希伯來書 12: 18 - 24）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>當上帝在西奈山宣告祂的律法時，這座山因其公義與聖潔而不可觸碰。然而，永生神所居住的錫安山卻歡迎所有願意得救的人。那麼，是什麼造成了這樣的差異？我們是否知道那將要來臨的錫安山是什麼呢？</h4></ul>
