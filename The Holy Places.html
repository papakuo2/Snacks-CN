	<ul><h3>15. 聖所（希伯來書 9: 1 - 10）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>正如聖經所描述，會幕以及聖殿都有兩層。祭司們定期進入頭一層，執行他們的儀式職責。只有大祭司每年一次進入第二層，用血來贖罪。所以，我們是否知道，我們屬靈的價值是著重於這些儀式職責，還是著重於上帝的公義與聖潔？如果是後者，那麼我們如何確知自己可以成為敬虔的人呢？</h4></ul>
