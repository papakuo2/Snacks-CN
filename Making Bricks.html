	<ul><h3>6. 製磚（出埃及記 5: 3 - 9）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>以色列人過去是牧羊人。在埃及生活多年之後，他們開始為法老製作磚塊。他們不僅必須辛苦勞動，也失去了自由。作為信徒，我們也必須在世上辛勤工作。我們是否也會像以色列人一樣失去對自己生命的掌控，特別是在屬靈生命上？如果會，那我們應該怎麼做？</h4></ul>
