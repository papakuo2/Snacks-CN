	<ul><h3>36. 愛（希伯來書 13: 1 - 7）</h3></ul>
	<ul><h3>前言</h3></ul>
	<ul><h4>上帝就是愛。因此，聖經教導我們彼此相愛。然而，由於我們仍然活在肉體之中，彼此相愛並不像我們想像的那樣簡單明確。愛的行為可能會帶來意想不到的後果，甚至混亂。所以，我們是否仍應該不加太多考量地表達愛？還是應該運用自己的判斷並更為保守？</h4></ul>
